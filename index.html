<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ResumeBuilder</title>
<style>
  /* ===== 嵌入苹方字体：把字体文件放进 ./fonts/ 即可，别人电脑打开也能用 ===== */
  @font-face {
    font-family: 'PingFang SC'; font-style: normal; font-weight: 400; font-display: swap;
    src: url('fonts/PingFangSC-Regular.woff2') format('woff2'),
         url('fonts/PingFangSC-Regular.woff') format('woff'),
         url('fonts/PingFang.ttc') format('truetype'),
         url('fonts/PingFang.ttf') format('truetype'),
         url('fonts/PingFang.otf') format('opentype'),
         url('fonts/PingFangSC.ttf') format('truetype'),
         url('fonts/PingFang-SC.ttf') format('truetype');
  }
  @font-face {
    font-family: 'PingFang SC'; font-style: normal; font-weight: 600; font-display: swap;
    src: url('fonts/PingFangSC-Medium.woff2') format('woff2'),
         url('fonts/PingFangSC-Semibold.woff2') format('woff2'),
         url('fonts/PingFangSC-Bold.woff2') format('woff2'),
         url('fonts/PingFang.ttc') format('truetype'),
         url('fonts/PingFang.ttf') format('truetype'),
         url('fonts/PingFang.otf') format('opentype');
  }
  :root {
    --bg: #f5f5f7; --panel: #ffffff; --ink: #1d1d1f; --muted: #6e6e73;
    --line: #e3e3e8; --brand: #0071e3; --brand-2: #0a84ff; --brand-soft: #e6f1fd;
    --ok: #34c759; --danger: #ff3b30; --radius: 12px;
    --shadow-sm: 0 1px 2px rgba(0,0,0,.04), 0 4px 14px rgba(0,0,0,.05);
    --shadow-md: 0 2px 6px rgba(0,0,0,.05), 0 12px 32px rgba(0,0,0,.08);
    --bg-deep: #eaeefa; --scrim-bg: rgba(244,245,251,.34);
    --fill: rgba(0,0,0,.04); --fill-hover: rgba(0,0,0,.08);
  }
  [data-theme="dark"] {
    --bg: #15151a; --panel: #1f1f24; --ink: #f5f5f7; --muted: #a1a1a6;
    --line: #34343a; --brand-soft: rgba(10,132,255,.22);
    --bg-deep: #0e0e12; --scrim-bg: rgba(15,15,18,.46);
    --fill: rgba(255,255,255,.08); --fill-hover: rgba(255,255,255,.16);
    --shadow-sm: 0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.35);
    --shadow-md: 0 2px 6px rgba(0,0,0,.35), 0 12px 32px rgba(0,0,0,.45);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "PingFang SC",
      "Helvetica Neue", "Hiragino Sans GB", "Microsoft YaHei", Arial, sans-serif;
    background: transparent; color: var(--ink); -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale; text-rendering: optimizeLegibility;
  }
  /* ===== 背景层：动画极光（离线/受限时）+ 每日 Bing 壁纸（联网时）+ 磨砂蒙版 ===== */
  #bg { position: fixed; inset: -12%; z-index: -3; background-color: #eaeefa;
    background-image:
      radial-gradient(42% 52% at 18% 28%, rgba(109,94,252,.42), transparent 62%),
      radial-gradient(46% 56% at 82% 22%, rgba(236,72,153,.36), transparent 62%),
      radial-gradient(52% 52% at 62% 82%, rgba(99,102,241,.36), transparent 62%);
    filter: blur(28px) saturate(1.15);
    animation: bgFloat 22s ease-in-out infinite alternate; }
  #bg.has-photo { background-image: var(--photo); background-size: cover; background-position: center;
    filter: blur(6px) saturate(1.05) brightness(.98); animation: kenburns 48s ease-in-out infinite alternate; }
  #bgScrim { position: fixed; inset: 0; z-index: -1; background: var(--scrim-bg); }
  #bgCredit { position: fixed; right: 14px; bottom: 10px; z-index: 1; font-size: 11px;
    color: var(--muted); letter-spacing: .2px; opacity: 0; transition: opacity .6s; pointer-events: none; }
  #bgCredit.show { opacity: 1; }
  @keyframes bgFloat { from { transform: translate3d(-2%, -1%, 0) scale(1.06); }
    to   { transform: translate3d(2%, 1%, 0) scale(1.14); } }
  @keyframes kenburns { from { transform: scale(1.04); } to { transform: scale(1.12) translate3d(-1.5%, -1%, 0); } }

  .app { display: grid; grid-template-rows: auto 1fr auto; height: 100vh; }
.appfoot { display: flex; align-items: center; justify-content: center; gap: 14px; flex-wrap: wrap;
  padding: 8px 16px; font-size: 12.5px; color: var(--muted, #6b7280);
  border-top: 1px solid var(--hair, rgba(0,0,0,.12));
  background: var(--glass-bg, rgba(255,255,255,.4));
  -webkit-backdrop-filter: var(--glass-filter, blur(12px)); backdrop-filter: var(--glass-filter, blur(12px)); }
.appfoot .ai-label { color: var(--muted, #6b7280); }
.appfoot .ai-mail { color: var(--accent, #2563eb); text-decoration: none; }
.appfoot .ai-mail:hover { text-decoration: underline; }
.appfoot .ai-sep { opacity: .5; }

  header.topbar {
    display: flex; align-items: center; gap: 16px; height: 56px; padding: 0 26px;
    background: rgba(255,255,255,.72);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    backdrop-filter: saturate(180%) blur(20px);
    border-bottom: 1px solid rgba(0,0,0,.08); z-index: 5;
  }
  .logo { width: 30px; height: 30px; border-radius: 8px; object-fit: contain; display: block; background: transparent; }
  .appname { font-size: 18px; font-weight: 600; letter-spacing: .2px; background: transparent;
    border: none; color: var(--ink); outline: none; max-width: 320px; }
  .appname::placeholder { color: rgba(0,0,0,.3); }
  .topbar .spacer { flex: 1; }
  .tb-btn { border: 1px solid var(--line); background: var(--fill); color: var(--ink);
    padding: 7px 15px; border-radius: 980px; font-size: 13px; cursor: pointer; transition: .2s; }
  .tb-btn:hover { background-color: var(--fill-hover); }
  .tb-btn.primary { background: var(--brand); color: #fff; border-color: transparent; }
  .tb-btn.primary:hover { background-color: rgba(0,113,227,.9); }

  .body { display: grid; grid-template-columns: 1.2fr 0.8fr; overflow: hidden; }
  .editor { overflow-y: auto; padding: 24px 28px 16px; }
  .preview-pane { background: transparent; border-left: 1px solid var(--line); overflow: auto; padding: 24px 20px 40px; }

  .stepper { display: flex; align-items: center; gap: 0; margin-bottom: 18px; flex-wrap: nowrap; overflow-x: auto; padding-bottom: 4px; }
  .step-node { display: flex; align-items: center; }
  .step-dot { width: 30px; height: 30px; border-radius: 50%; background: #fff; border: 1.5px solid var(--line);
    color: var(--muted); font-weight: 600; font-size: 13px; display: grid; place-items: center;
    cursor: pointer; transition: .2s; flex: 0 0 auto; }
  .step-dot:hover { border-color: var(--brand); color: var(--brand); }
  .step-dot.active { background: var(--brand); border-color: transparent; color: #fff; box-shadow: 0 3px 10px rgba(0,113,227,.32); }
  .step-dot.done { background: var(--ok); border-color: transparent; color: #fff; }
  .step-label { font-size: 12px; color: var(--muted); margin-left: 7px; margin-right: 12px; white-space: nowrap; flex: 0 0 auto; }
  .step-label.active { color: var(--ink); font-weight: 600; }
  .step-line { width: 20px; height: 1.5px; background: var(--line); flex: 0 0 auto; }

  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    padding: 22px 22px 24px; box-shadow: var(--shadow-sm); margin-bottom: 16px; }
  .step-title { font-size: 22px; font-weight: 700; letter-spacing: -.3px; margin: 2px 0 4px; }
  .step-sub { color: var(--muted); font-size: 13.5px; margin: 0 0 18px; }

  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }
  .field { display: flex; flex-direction: column; gap: 7px; }
  .field label { font-size: 12.5px; color: var(--ink); font-weight: 600; letter-spacing: .1px; }
  .field .tip { font-size: 11.5px; color: var(--muted); font-weight: 400; }
  input, textarea, select {
    width: 100%; border: 1px solid var(--line); border-radius: 11px; padding: 11px 13px;
    font-size: 14px; color: var(--ink); background: var(--panel); transition: .2s; font-family: inherit;
  }
  input:focus, textarea:focus, select:focus { outline: none; border-color: var(--brand);
    box-shadow: 0 0 0 4px var(--brand-soft); }
  textarea { resize: vertical; min-height: 60px; line-height: 1.5; }
  select { appearance: none; -webkit-appearance: none; cursor: pointer;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path fill='%2386868b' d='M1 1l5 5 5-5'/></svg>");
    background-repeat: no-repeat; background-position: right 13px center; padding-right: 36px; }

  .item { border: 1px solid var(--line); border-radius: 14px; padding: 16px 16px 10px; margin-bottom: 16px;
    background: var(--panel); position: relative; }
  .item .item-del { position: absolute; top: 14px; right: 14px; border: none; background: var(--fill); color: #86868b;
    width: 28px; height: 28px; border-radius: 50%; cursor: pointer; font-size: 14px; display: grid; place-items: center; transition: .2s; }
  .item .item-del:hover { background: var(--danger); color: #fff; }

  .sublist { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }
  .subrow { display: flex; gap: 10px; align-items: stretch; }
  .subrow .del-pill { flex: 0 0 auto; border: none; background: var(--fill); color: #86868b;
    width: 30px; border-radius: 50%; cursor: pointer; font-size: 14px; transition: .2s; }
  .subrow .del-pill:hover { background: var(--danger); color: #fff; }
  .subrow textarea { min-height: 42px; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .chip { border: 1px solid var(--line); background: var(--panel); color: var(--ink); padding: 8px 15px;
    border-radius: 980px; font-size: 13px; cursor: pointer; transition: .2s; user-select: none; }
  .chip:hover { border-color: var(--brand); color: var(--brand); }
  .chip.on { background: var(--brand); color: #fff; border-color: transparent; }
  .chip-custom { border: 1px dashed var(--line); border-radius: 980px; padding: 8px 15px; width: auto;
    min-width: 170px; font-size: 13px; }
  .chip-custom:focus { border-color: var(--brand); box-shadow: 0 0 0 4px var(--brand-soft); outline: none; }

  .add-btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--brand);
    background: rgba(0,113,227,.06); color: var(--brand); font-weight: 600; font-size: 13px; padding: 9px 15px;
    border-radius: 980px; cursor: pointer; transition: .2s; margin-top: 6px; }
  .add-btn:hover { background-color: rgba(0,113,227,.22); }
  .add-btn .plus { font-size: 16px; line-height: 1; }

  .photobox { display: flex; align-items: center; gap: 16px; }
  .photo { width: 84px; height: 108px; border-radius: 12px; border: 1px solid var(--line); background: #f5f5f7;
    display: grid; place-items: center; color: var(--muted); font-size: 12px; text-align: center; overflow: hidden; cursor: pointer; transition: .2s; }
  .photo:hover { border-color: var(--brand); }
  .photo img { width: 100%; height: 100%; object-fit: cover; }
  .photo input { display: none; }

  .nav { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; flex-wrap: wrap; gap: 10px; }
  .nav-group { display: flex; gap: 10px; }
  .btn { border: none; border-radius: 980px; padding: 11px 22px; font-size: 14px; font-weight: 600; cursor: pointer; transition: .2s; }
  .btn-ghost { background: var(--fill); color: var(--ink); }
  .btn-ghost:hover { background-color: var(--fill-hover); color: var(--danger); }
  .btn-back { background: var(--fill); color: var(--ink); }
  .btn-back:hover { background-color: var(--fill-hover); }
  .btn-next { background: var(--brand); color: #fff; box-shadow: 0 2px 10px rgba(0,113,227,.3); }
  .btn-next:hover { background-color: rgba(0,113,227,.9); transform: translateY(-1px); }
  .btn:disabled { opacity: .4; cursor: not-allowed; transform: none; }

  .pv-sheet { width: 100%; max-width: 210mm; min-height: 297mm; margin: 0 auto; background: #fff; border-radius: 10px; box-shadow: var(--shadow-md);
    padding: 18mm 16mm; font-size: 13px; line-height: 1.65; color: #1d1d1f; }
  .pv-photo { float: right; width: 70px; height: 90px; border-radius: 8px; object-fit: cover; border: 1px solid #e3e3e8; margin-left: 12px; }
  .pv-name { font-size: 26px; font-weight: 700; letter-spacing: .4px; margin: 0 0 4px; color: #1d1d1f; }
  .pv-contact { color: #515154; font-size: 12.5px; margin-bottom: 16px; }
  .pv-contact span { margin-right: 12px; white-space: nowrap; }
  .pv-sec { margin-top: 16px; }
  .pv-sec h4 { font-size: 13px; font-weight: 700; letter-spacing: .4px; color: #1d1d1f; margin: 0 0 8px; padding-bottom: 6px; border-bottom: 1px solid rgba(0,0,0,.1); }
  .pv-block { margin-bottom: 10px; }
  .pv-top { display: flex; justify-content: space-between; font-weight: 600; }
  .pv-sub2 { color: #515154; font-size: 12px; margin: 1px 0 4px; }
  .pv-ul { margin: 2px 0 0; padding-left: 18px; }
  .pv-ul li { margin-bottom: 3px; }
  .pv-empty { color: #b0b0b6; font-style: italic; }

  .toast { position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: rgba(0,0,0,.82); color: #fff; padding: 12px 22px; border-radius: 980px; font-size: 13px; opacity: 0;
    pointer-events: none; transition: .3s; z-index: 99; -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (max-width: 1024px) {
    .body { grid-template-columns: 1fr; }
    .preview-pane { display: none; }
    .grid3 { grid-template-columns: 1fr 1fr; }
  }

  /* ===== 设置面板 ===== */
  .modal-mask { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.32);
    -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
    display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: .25s; }
  .modal-mask.show { opacity: 1; pointer-events: auto; }
  .modal { width: min(440px, 92vw); background: var(--panel); border: 1px solid var(--line); border-radius: 18px;
    box-shadow: var(--shadow-md); overflow: hidden; transform: translateY(12px) scale(.98); transition: .25s; }
  .modal-mask.show .modal { transform: none; }
  .modal-head { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px;
    border-bottom: 1px solid var(--line); font-size: 16px; font-weight: 700; }
  .modal-close { border: none; background: var(--fill); color: var(--muted); width: 30px; height: 30px;
    border-radius: 50%; cursor: pointer; font-size: 15px; transition: .2s; }
  .modal-close:hover { background: var(--fill-hover); color: var(--danger); }
  .modal-body { padding: 18px 20px 22px; display: flex; flex-direction: column; gap: 16px; }
  .set-row { display: flex; flex-direction: column; gap: 8px; }
  #customRow { flex-direction: row; align-items: center; flex-wrap: wrap; }
  .set-label { font-size: 13px; font-weight: 600; color: var(--ink); }
  .set-val { color: var(--brand); font-weight: 600; margin-left: 6px; }
  .set-tip { font-size: 12px; color: var(--muted); line-height: 1.5; }
  .set-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 12px; }
  .seg { display: inline-flex; background: var(--fill); border-radius: 980px; padding: 3px; gap: 3px; width: fit-content; }
  .seg-btn { border: none; background: transparent; color: var(--muted); padding: 7px 18px; border-radius: 980px;
    cursor: pointer; font-size: 13px; font-weight: 600; transition: .2s; }
  .seg-btn.active { background: var(--panel); color: var(--brand); box-shadow: var(--shadow-sm); }
  input[type=range] { width: 100%; accent-color: var(--brand); }

  /* ===== 自绘玻璃下拉（触发框圆角 + 浮层玻璃） ===== */
  .glass-select { position: relative; }
  .gs-trigger { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 8px;
    text-align: left; cursor: pointer; font: inherit; color: var(--ink); padding: 11px 14px;
    border-radius: 12px; border: 1px solid var(--glass-brd); background-color: var(--glass-bg);
    box-shadow: var(--glass-shadow); appearance: none; -webkit-appearance: none;
    -webkit-backdrop-filter: var(--glass-filter); backdrop-filter: var(--glass-filter); position: relative; }
  .gs-trigger::before, .gs-pop::before { content: ""; position: absolute; inset: 0; border-radius: inherit;
    pointer-events: none; background: var(--sheen); z-index: 0; }
  .gs-value { position: relative; z-index: 1; }
  .gs-caret { position: relative; z-index: 1; color: var(--muted); font-size: 12px; transition: transform .2s; }
  .glass-select.open .gs-caret { transform: rotate(180deg); }
  .gs-pop { position: fixed; z-index: 200; padding: 6px; border-radius: 16px; border: 1px solid var(--glass-brd);
    background-color: var(--glass-bg); box-shadow: var(--glass-shadow);
    -webkit-backdrop-filter: var(--glass-filter); backdrop-filter: var(--glass-filter); display: flex;
    flex-direction: column; gap: 2px; }
  .gs-pop[hidden] { display: none; }
  .gs-opt { padding: 10px 12px; border-radius: 11px; cursor: pointer; font-size: 13px; color: var(--ink);
    position: relative; z-index: 1; transition: .15s; }
  .gs-opt:hover { background-color: var(--fill-hover); }
  .gs-opt.sel { background-color: rgba(0,113,227,.18); color: var(--brand); font-weight: 600; }
  [data-theme="dark"] .gs-opt.sel { background-color: rgba(10,132,255,.28); color: #fff; }

  /* ===== 深色模式：玻璃顶栏适配；右侧 A4 仍是白纸文档 ===== */
  [data-theme="dark"] header.topbar { background: rgba(28,28,32,.6); border-bottom-color: rgba(255,255,255,.08); }
  [data-theme="dark"] .tb-btn, [data-theme="dark"] .appname { color: #f5f5f7; }
  [data-theme="dark"] .seg-btn.active { background: var(--brand); color: #fff; }

  /* ============ 玻璃材质 ============ */
  :root {
    --glass-alpha: .42; --glass-bg: rgba(255,255,255, var(--glass-alpha));
    --glass-brd: rgba(255,255,255,.6);
    --glass-shadow: 0 10px 30px rgba(20,20,60,.10), inset 0 0 0 1px rgba(255,255,255,.35), inset 0 1px 0 rgba(255,255,255,.7);
    --shadow-md: 0 14px 34px rgba(20,20,60,.16);
    --glass-blur: 12px;
    --glass-url: ;
    --glass-filter: blur(var(--glass-blur)) saturate(180%) brightness(1.06) var(--glass-url);
    --sheen: linear-gradient(180deg, rgba(255,255,255,.6), rgba(255,255,255,0) 36%);
  }
  [data-theme="dark"] {
    --glass-bg: rgba(40,40,46, var(--glass-alpha));
    --glass-brd: rgba(255,255,255,.14);
    --glass-shadow: 0 10px 30px rgba(0,0,0,.4), inset 0 0 0 1px rgba(255,255,255,.12), inset 0 1px 0 rgba(255,255,255,.2);
    --shadow-md: 0 14px 34px rgba(0,0,0,.45);
    --glass-blur: 12px;
    --glass-filter: blur(var(--glass-blur)) saturate(150%) brightness(.96) var(--glass-url);
    --sheen: linear-gradient(180deg, rgba(255,255,255,.18), rgba(255,255,255,0) 32%);
  }
  header.topbar, .card, .item, .modal, .preview-pane {
    background: var(--glass-bg); border: 1px solid var(--glass-brd); box-shadow: var(--glass-shadow);
    -webkit-backdrop-filter: var(--glass-filter); backdrop-filter: var(--glass-filter); position: relative;
  }
  header.topbar::before, .card::before, .item::before, .modal::before {
    content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
    background: var(--sheen); z-index: 0;
  }
  /* 交互控件统一玻璃质感 */
  .tb-btn, .btn, .add-btn, .chip, .seg-btn, select {
    -webkit-backdrop-filter: var(--glass-filter); backdrop-filter: var(--glass-filter);
    border: 1px solid var(--glass-brd); background-color: var(--glass-bg);
    box-shadow: var(--glass-shadow); position: relative;
  }
  select { border-radius: 12px; } /* Apple 圆角下拉方框 */
  /* 蓝色强调按钮 / 选中态：半透明蓝玻璃 */
  .tb-btn.primary, .btn-next, .chip.on, .add-btn, .seg-btn.active {
    background-color: rgba(0,113,227,.72); border-color: rgba(255,255,255,.4); color: #fff;
  }
  [data-theme="dark"] .tb-btn.primary, [data-theme="dark"] .btn-next, [data-theme="dark"] .chip.on,
  [data-theme="dark"] .add-btn, [data-theme="dark"] .seg-btn.active {
    background-color: rgba(10,132,255,.62); border-color: rgba(255,255,255,.2);
  }
  /* 液态高光覆盖所有玻璃控件（select 为原生控件，不支持伪元素高光） */
  header.topbar::before, .card::before, .item::before, .modal::before,
  .tb-btn::before, .btn::before, .add-btn::before, .chip::before, .seg-btn::before {
    content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
    background: var(--sheen); z-index: 0;
  }
  /* 真实折射（SVG 位移滤镜）：所有玻璃面均参照它折射背景；不支持的浏览器静默回退为轻磨砂玻璃 */
  @supports ((-webkit-backdrop-filter: url(#liquidGlass)) or (backdrop-filter: url(#liquidGlass))) {
    :root { --glass-url: url(#liquidGlass); }
  }
  /* ===== 苹果风动效：滚动揭示 + 顶栏载入 + 玻璃微抬升 ===== */
  .card, .item { transition: transform .25s ease, box-shadow .25s ease; }
  .card:hover, .item:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
  @media (prefers-reduced-motion: no-preference) {
    header.topbar { animation: topbar-in .7s cubic-bezier(.22,.61,.36,1) both; }
    header.topbar::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
      background: linear-gradient(115deg, transparent 38%, rgba(255,255,255,.55) 50%, transparent 62%);
      background-size: 250% 100%; background-position: 130% 0; opacity: 0; z-index: 1;
      animation: glass-sweep 1.15s ease-out .15s both; }
    @keyframes topbar-in { 0% { opacity: 0; transform: translateY(-14px); } 100% { opacity: 1; transform: translateY(0); } }
    @keyframes glass-sweep { 0% { background-position: 130% 0; opacity: 0; } 12% { opacity: 1; } 100% { background-position: -30% 0; opacity: 0; } }
    body.js-reveal .card:not(:hover) { opacity: var(--reveal, 0); translate: 0 calc((1 - var(--reveal, 0)) * 40px); scale: calc(.97 + var(--reveal, 0) * .03); }
    body.js-reveal .item:not(:hover) { opacity: var(--reveal, 0); translate: 0 calc((1 - var(--reveal, 0)) * 34px); scale: calc(.98 + var(--reveal, 0) * .02); }
  }
</style>

/* 安全的本地存储：file:// 下部分浏览器会禁用 localStorage，这里静默降级 */
const LS = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch(e){} },
};

let state = loadState();

/* ============================ 工具函数 ============================ */
function loadState(){
  try { const s = JSON.parse(LS.get('resume_v1')); if (s && s.basic) return normalize(s); } catch(e){}
  return defaultState();
}
/* 兼容旧存档：补齐缺失字段、把非数组字段规范成数组，避免 arr.filter 报错 */
function normalize(s){
  const d = defaultState(); s = s||{};
  const out = Object.assign({}, d, s);
  out.basic = Object.assign({}, d.basic, s.basic||{});
  const A = x => Array.isArray(x)?x:[];
  out.education = A(s.education).map(e=>{ e=e||{}; return Object.assign({}, d.education[0], e,
    { honors: A(e.honors).map(h=> typeof h==='string'?{name:h,time:'',detail:''}:(h||{name:'',time:'',detail:''})) }); });
  out.internship = A(s.internship).map(e=>{ e=e||{}; return Object.assign({}, d.internship[0], e, { points: A(e.points) }); });
  out.project = A(s.project).map(e=>{ e=e||{}; return Object.assign({}, d.project[0], e, { competitions: A(e.competitions) }); });
  out.practice = A(s.practice).map(e=>{ e=e||{}; return Object.assign({}, d.practice[0], e, { points: A(e.points) }); });
  out.skill = Object.assign({}, d.skill, s.skill||{});
  out.skill.office = A((s.skill||{}).office);
  out.skill.others = A((s.skill||{}).others);
  out.hobby = A(s.hobby);
  out.custom = A(s.custom).map(x=>{ x=x||{}; return { title:(x.title||''), content:(x.content||'') }; });
  return out;
}
function saveState(){ LS.set('resume_v1', JSON.stringify(state)); }
function getByPath(path){ return path.split('.').reduce((o,k)=> o==null?o:o[k], state); }
function setByPath(path, val){ const p=path.split('.'); let o=state; for(let i=0;i<p.length-1;i++) o=o[p[i]]; o[p[p.length-1]]=val; }
function el(tag, attrs={}, children=[]){
  const e=document.createElement(tag);
  for (const [k,v] of Object.entries(attrs)){
    if (k==='class') e.className=v;
    else if (k==='html') e.innerHTML=v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k==='value') e.value=v;
    else e.setAttribute(k, v);
  }
  (Array.isArray(children)?children:[children]).forEach(c=>{ if(c==null) return; e.appendChild(typeof c==='string'?document.createTextNode(c):c); });
  return e;
}
function field(labelText, tip, control){
  return el('div',{class:'field'},[ el('label',{},[ labelText, tip?el('span',{class:'tip'},' '+tip):null ]), control ]);
}
function text(path, placeholder, type='text'){
  return el('input',{ type, placeholder, value:getByPath(path)??'', 'data-path':path,
    oninput:(e)=>{ setByPath(path, e.target.value); saveState(); renderPreview(); } });
}
function textarea(path, placeholder, rows=3){
  return el('textarea',{ rows, placeholder, 'data-path':path,
    oninput:(e)=>{ setByPath(path, e.target.value); saveState(); renderPreview(); } }, getByPath(path)??'');
}
/* 手机号：自动按 3-4-4 加“-”号 */
function fmtPhone(d){ d=(d||'').replace(/\D/g,'').slice(0,11); if(d.length<=3) return d; if(d.length<=7) return d.slice(0,3)+'-'+d.slice(3); return d.slice(0,3)+'-'+d.slice(3,7)+'-'+d.slice(7); }
function phoneInput(path, placeholder){
  return el('input',{ type:'tel', placeholder, value:fmtPhone(getByPath(path)||''), 'data-path':path,
    oninput:(e)=>{ const f=fmtPhone(e.target.value); e.target.value=f; setByPath(path, f); saveState(); renderPreview(); } });
}
/* 下拉（无“其他”） */
function select(path, options, placeholder){
  const sel = el('select',{ 'data-path':path, onchange:(e)=>{ setByPath(path, e.target.value); saveState(); renderPreview(); }});
  sel.appendChild(el('option',{value:''}, placeholder||'请选择'));
  options.forEach(o=> sel.appendChild(el('option',{value:o}, o)));
  sel.value = getByPath(path)||'';
  return sel;
}
/* 下拉（带“其他”自由填写） */
function selectOther(path, options, placeholder){
  const cur = getByPath(path)||'';
  const isOther = cur && !options.includes(cur);
  const wrap = el('div',{});
  const sel = el('select',{ 'data-path':path, onchange:(e)=>{
    if (e.target.value==='__other__'){ setByPath(path,'__other__'); renderStepContent(); }
    else { setByPath(path, e.target.value); saveState(); renderPreview(); }
  }});
  sel.appendChild(el('option',{value:''}, placeholder||'请选择'));
  options.forEach(o=> sel.appendChild(el('option',{value:o}, o)));
  if(!options.includes('其他') && !options.includes('__other__')) sel.appendChild(el('option',{value:'__other__'},'其他（请填写）'));
  sel.value = isOther ? '__other__' : cur;
  wrap.appendChild(sel);
  if (isOther){
    const t = el('input',{ placeholder:'请填写具体内容', value:(cur && cur!=='__other__')?cur:'', style:'margin-top:8px',
      oninput:(e)=>{ setByPath(path, e.target.value); saveState(); renderPreview(); }});
    wrap.appendChild(t);
    setTimeout(()=>t.focus(), 0);
  }
  return wrap;
}
/* 可多选标签 */
function chipMulti(path, options){
  const wrap = el('div',{class:'chips'});
  function rebuild(){
    wrap.innerHTML='';
    const arr = getByPath(path);
    options.forEach(o=>{
      const on = arr.includes(o);
      wrap.appendChild(el('div',{class:'chip'+(on?' on':''), onclick:()=>{
        const a=getByPath(path); const i=a.indexOf(o);
        if(i>=0) a.splice(i,1); else a.push(o); saveState(); rebuild(); renderPreview();
      }}, o));
    });
    arr.filter(v=>!options.includes(v)).forEach(v=>{
      wrap.appendChild(el('div',{class:'chip on', onclick:()=>{
        const a=getByPath(path); const i=a.indexOf(v); if(i>=0) a.splice(i,1); saveState(); rebuild(); renderPreview();
      }}, v+' ✕'));
    });
    wrap.appendChild(el('input',{class:'chip-custom', placeholder:'自定义，输入后回车添加',
      onkeydown:(e)=>{ if(e.key==='Enter'){ const t=e.target.value.trim(); if(t){ getByPath(path).push(t); e.target.value=''; saveState(); rebuild(); renderPreview(); } } }}));
  }
  rebuild();
  return wrap;
}
/* 年-月下拉（起止） */
function ymOptions(){
  const a=[]; for(let y=2030;y>=2000;y--) for(const m of ['01','02','03','04','05','06','07','08','09','10','11','12']) a.push(y+'.'+m); return a;
}

function periodFields(prefix, label){

function periodText(o){ const s=(o.periodStart||'').replace(/-/g,'.'), e=(o.periodEnd||'').replace(/-/g,'.'); if(s&&e) return s+' – '+e; return s||e||''; }

function renderStepContent(){

function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function renderPreview(){
  const p = document.getElementById('preview'); const b = state.basic; let html='';
  if (b.photo) html += `<img class="pv-photo" src="${b.photo}" />`;
  html += `<div class="pv-name">${esc(b.name)||'你的姓名'}</div>`;
  const contact=[];
  if (b.email) contact.push('邮箱：'+esc(b.email));
  if (b.phone) contact.push('手机：'+esc(b.phone));
  if (b.political && b.political!=='__other__') contact.push('政治面貌：'+esc(b.political));
  html += `<div class="pv-contact">${contact.map(c=>`<span>${c}</span>`).join('')||'<span class="pv-empty">未填写联系方式</span>'}</div>`;
  if (state.education.some(e=>e.school||e.degree||e.major)){
    html += `<div class="pv-sec"><h4>教育背景</h4>`;
    state.education.forEach(e=>{
      if(!e.school && !e.degree && !e.major) return;
      let schoolTxt = esc(e.school);
      if(e.tier==='985'||e.tier==='211'||e.tier==='双一流') schoolTxt += '（'+esc(e.tier)+'）';
      const degTxt = (e.discipline?esc(e.discipline):'') + (e.degree?esc(e.degree):'');
      html += `<div class="pv-block"><div class="pv-top"><span>${schoolTxt}${degTxt?'｜'+degTxt:''}${e.major?'｜'+esc(e.major):''}</span><span>${esc(periodText(e))}</span></div>`;
      if (e.gpa) html += `<div class="pv-sub2">成绩：${esc(e.gpa)}</div>`;
      if (e.rank) html += `<div class="pv-sub2">${(e.rankType==='gpa'?'GPA':'排名')}：${esc(e.rank)}</div>`;
      const hs=(e.honors||[]).filter(x=>x&&x.name&&x.name.trim());
      if (hs.length) html += `<div class="pv-sub2">荣誉：${hs.map(h=> esc(h.name) + (h.time?('（'+esc((h.time||'').replace(/-/g,'.'))+'）'):'') + (h.detail?('：'+esc(h.detail)):'')).join('；')}</div>`;
      html += `</div>`;
    });
    html += `</div>`;
  }
  if (state.internship.some(x=>x.company||x.role)){
    html += `<div class="pv-sec"><h4>实习经历</h4>`;
    state.internship.forEach(x=>{
      if(!x.company && !x.role) return;
      html += `<div class="pv-block"><div class="pv-top"><span>${esc(x.company)}${x.role?'｜'+esc(x.role):''}</span><span>${esc(periodText(x))}</span></div>`;
      const ps=(x.points||[]).filter(p=>p.title||p.detail);
      if (ps.length){ html += '<ul class="pv-ul">'; ps.forEach(p=> html += `<li><b>${esc(p.title)}</b>${p.detail?': '+esc(p.detail):''}</li>`); html += '</ul>'; }
      html += `</div>`;
    });
    html += `</div>`;
  }
  if (state.project.some(x=>x.name)){
    html += `<div class="pv-sec"><h4>项目 & 竞赛经历</h4>`;
    state.project.forEach(x=>{
      if(!x.name) return;
      html += `<div class="pv-block"><div class="pv-top"><span>${esc(x.name)}</span><span>${esc(periodText(x))}</span></div>`;
      if (x.action) html += `<div class="pv-sub2"><b>行动：</b>${esc(x.action)}</div>`;
      if (x.result) html += `<div class="pv-sub2"><b>结果：</b>${esc(x.result)}</div>`;
      const cs=(x.competitions||[]).filter(c=>c.name||c.award);
      if (cs.length){ html += '<ul class="pv-ul">'; cs.forEach(c=> html += `<li>${esc(c.name)}${c.award?'｜'+esc(c.award):''}</li>`); html += '</ul>'; }
      html += `</div>`;
    });
    html += `</div>`;
  }
  if (state.practice.some(x=>x.role)){
    html += `<div class="pv-sec"><h4>实践 / 学生工作</h4>`;
    state.practice.forEach(x=>{
      if(!x.role) return;
      html += `<div class="pv-block"><div class="pv-top"><span>${esc(x.role)}</span><span>${esc(periodText(x))}</span></div>`;
      const ps=(x.points||[]).filter(p=>p.title||p.detail);
      if (ps.length){ html += '<ul class="pv-ul">'; ps.forEach(p=> html += `<li><b>${esc(p.title)}</b>${p.detail?': '+esc(p.detail):''}</li>`); html += '</ul>'; }
      html += `</div>`;
    });
    html += `</div>`;
  }
  const sk=state.skill;
  const others=(sk.others||[]).filter(x=>x.trim());
  const office=(sk.office||[]).filter(x=>x.trim());
  if (sk.english || office.length || others.length){
    html += `<div class="pv-sec"><h4>语言与技能</h4><div class="pv-block">`;
    if (sk.english) html += `<div class="pv-sub2"><b>英语：</b>${esc(sk.english)}</div>`;
    if (office.length) html += `<div class="pv-sub2"><b>办公软件：</b>${office.map(esc).join('、')}</div>`;
    if (others.length) html += `<div class="pv-sub2"><b>其他：</b>${others.map(esc).join('、')}</div>`;
    html += `</div></div>`;

  const hb=(state.hobby||[]).filter(x=>x.trim());
  if (hb.length) html += `<div class="pv-sec"><h4>兴趣爱好</h4><div class="pv-sub2">${hb.map(esc).join('、')}</div></div>`;
  (state.custom||[]).filter(x=>(x.title||'').trim()||(x.content||'').trim()).forEach(s=>{
    html += `<div class="pv-sec"><h4>${esc(s.title||'自定义栏目')}</h4>`;
    (s.content||'').split(/\n+/).filter(Boolean).forEach(line=> html += `<div class="pv-sub2">${esc(line)}</div>`);
    html += `</div>`;
  });
  p.innerHTML = html || '<div class="pv-empty">开始填写左侧内容，这里会实时生成简历预览。</div>';
}

/* ============================ 顶栏 / 步骤导航 ============================ */
function isStepComplete(i){
  const st = STEPS[i].key, s = state;
  if(st==='basic') return !!(s.basic.name&&s.basic.name.trim()) && !!((s.basic.phone||'').trim()||(s.basic.email||'').trim());
  if(st==='education') return s.education.some(e=>(e.school||'').trim() && (e.degree||'').trim());
  if(st==='internship') return s.internship.some(x=>(x.company||'').trim() && (x.role||'').trim());
  if(st==='project') return s.project.some(x=>(x.name||'').trim());
  if(st==='practice') return s.practice.some(x=>(x.role||'').trim());
  if(st==='skill') return !!((s.skill.english||'').trim()) || (s.skill.office||[]).length || (s.skill.others||[]).length;
  if(st==='hobby') return (s.hobby||[]).length>0;
  if(st==='custom') return (s.custom||[]).some(x=>(x.title||'').trim() || (x.content||'').trim());
  return true;
}
function renderStepper(){
  const s=document.getElementById('stepper'); s.innerHTML='';
  STEPS.forEach((st,i)=>{
    const done = isStepComplete(i) && i<current;
    const dot=el('div',{class:'step-dot'+(i===current?' active':(done?' done':'')), onclick:()=>{
      if(i===current) return;
      current=i; refresh();
    }}, done?'✓':String(i+1));
    const label=el('div',{class:'step-label'+(i===current?' active':'')}, st.title);
    s.appendChild(el('div',{class:'step-node'},[dot,label]));
    if (i<STEPS.length-1) s.appendChild(el('div',{class:'step-line'}));
  });
}
function refresh(){
  document.getElementById('stepTitle').textContent = STEPS[current].title;
  document.getElementById('stepSub').textContent = STEPS[current].sub;
  renderStepper(); renderStepContent(); renderPreview();
  document.getElementById('btnBack').disabled = current===0;
  document.getElementById('btnNext').textContent = current===STEPS.length-1 ? '完成 / 预览' : '下一步 →';
  if(document.body.classList.contains('js-reveal')){ _revealEls = revealCollect(); updateReveal(); }
}
document.getElementById('btnBack').addEventListener('click',()=>{ if(current>0){current--; refresh();} });
document.getElementById('btnNext').addEventListener('click',()=>{
  if(current<STEPS.length-1){ current++; refresh(); }

});
document.getElementById('btnClearStep').addEventListener('click',()=>{

/* 背景：联网时拉取每日 Bing 壁纸（带缓慢 Ken Burns 推拉）；离线/受限则保留动态极光渐变 */
/* ============================ 设置：主题 / 背景 / 玻璃 ============================ */
const PRESETS = {
  dawn: 'linear-gradient(135deg,#ffecd2 0%,#fcb69f 55%,#ff9a9e 100%)',
  dusk: 'linear-gradient(135deg,#a18cd1 0%,#fbc2eb 100%)',
  deep: 'linear-gradient(135deg,#0f2027 0%,#203a43 50%,#2c5364 100%)'
};
function loadSettings(){ try{ const s=JSON.parse(LS.get('rb_settings')); if(s&&typeof s==='object') return Object.assign({theme:'dark',bgMode:'auto',customBg:'',glass:8}, s); }catch(e){} return {theme:'dark',bgMode:'auto',customBg:'',glass:8}; }
let settings = loadSettings();
function saveSettings(){ LS.set('rb_settings', JSON.stringify(settings)); }
function applyTheme(){ const dark=settings.theme==='dark'; document.documentElement.dataset.theme=dark?'dark':''; document.querySelectorAll('#themeSeg .seg-btn').forEach(b=> b.classList.toggle('active', b.dataset.theme===(dark?'dark':'light'))); }
function applyGlass(){ const v=settings.glass; const dark=settings.theme==='dark';
  const blur=2 + v*0.7; const alpha=(0.26 + v*0.014) + (dark?0.04:0);
  const root=document.documentElement.style;
  root.setProperty('--glass-blur', blur.toFixed(1)+'px');
  root.setProperty('--glass-alpha', alpha.toFixed(3));
  const dm=document.querySelector('#liquidGlass feDisplacementMap'); if(dm) dm.setAttribute('scale', v);
  const gv=document.getElementById('glassVal'); if(gv) gv.textContent=v; }
function applyBackground(){
  const bg=document.getElementById('bg');
  bg.classList.remove('has-photo'); bg.style.removeProperty('--photo'); bg.style.backgroundImage='';
  const m=settings.bgMode;
  if(m==='auto'){ applyBingWallpaper(); return; }
  if(m==='custom'){ if(settings.customBg){ bg.style.setProperty('--photo',`url('${settings.customBg}')`); bg.classList.add('has-photo'); } return; }
  if(PRESETS[m]) bg.style.backgroundImage=PRESETS[m];
}

/* 自绘玻璃下拉：触发框 + 浮层（移入 body 避免被弹窗裁剪，拥有独立玻璃折射） */
function setupGlassSelect(triggerId, popId, onChange){
  const trigger=document.getElementById(triggerId);
  const pop=document.getElementById(popId);
  const valueEl=trigger.querySelector('.gs-value');
  const root=trigger.closest('.glass-select');
  document.body.appendChild(pop);
  function setVal(v, silent){ const opt=[...pop.querySelectorAll('.gs-opt')].find(o=>o.dataset.value===v);
    valueEl.textContent=opt?opt.textContent:v;
    pop.querySelectorAll('.gs-opt').forEach(o=>o.classList.toggle('sel', o.dataset.value===v));
    if(!silent) onChange(v); }
  function openPop(){ pop.hidden=false; const r=trigger.getBoundingClientRect();
    const ph=pop.offsetHeight, pw=Math.max(r.width,200); let top=r.bottom+8;
    if(top+ph>window.innerHeight-8) top=Math.max(8, r.top-ph-8);
    pop.style.minWidth=pw+'px'; pop.style.left=r.left+'px'; pop.style.top=top+'px'; root.classList.add('open'); }
  function closePop(){ pop.hidden=true; root.classList.remove('open'); }
  trigger.addEventListener('click',(e)=>{ e.stopPropagation(); pop.hidden?openPop():closePop(); });
  pop.addEventListener('click',(e)=>{ const o=e.target.closest('.gs-opt'); if(!o) return; setVal(o.dataset.value); closePop(); });
  document.addEventListener('click',(e)=>{ if(!pop.hidden && !pop.contains(e.target) && e.target!==trigger) closePop(); });
  window.addEventListener('resize',()=>{ if(!pop.hidden) closePop(); });
  window.addEventListener('scroll',()=>{ if(!pop.hidden) closePop(); }, true);
  return { setVal };
}

/* 把所有原生 select 升级为自绘玻璃下拉（原生 select 保留并隐藏，仅作数据/事件源） */
function closeAllPops(){ document.querySelectorAll('.gs-pop').forEach(p=>p.hidden=true);
  document.querySelectorAll('.glass-select.open').forEach(w=>w.classList.remove('open')); }
function upgradeGlassSelect(select){
  if(select.dataset.glass==='1') return;
  select.dataset.glass='1';
  const wrap=document.createElement('div'); wrap.className='glass-select';
  const trigger=document.createElement('button'); trigger.type='button'; trigger.className='gs-trigger';
  const val=document.createElement('span'); val.className='gs-value';
  const caret=document.createElement('span'); caret.className='gs-caret'; caret.textContent='▾';
  trigger.appendChild(val); trigger.appendChild(caret);
  const pop=document.createElement('div'); pop.className='gs-pop'; pop.hidden=true; pop.setAttribute('data-glass-pop','form');
  [...select.options].forEach(o=>{ const d=document.createElement('div'); d.className='gs-opt'; d.dataset.value=o.value; d.textContent=o.textContent; pop.appendChild(d); });
  wrap.appendChild(trigger); wrap.appendChild(pop);
  select.parentNode.insertBefore(wrap, select);
  select.style.cssText='display:none';
  const sync=()=>{ const so=select.selectedOptions&&select.selectedOptions[0];
    val.textContent=so?so.textContent:select.value;
    [...pop.children].forEach(o=>o.classList.toggle('sel', o.dataset.value===select.value)); };
  sync();
  function openPop(){ closeAllPops(); pop.hidden=false; const r=trigger.getBoundingClientRect();
    const ph=pop.offsetHeight, pw=Math.max(r.width,160); let top=r.bottom+8;
    if(top+ph>window.innerHeight-8) top=Math.max(8, r.top-ph-8);
    pop.style.minWidth=pw+'px'; pop.style.left=r.left+'px'; pop.style.top=top+'px'; wrap.classList.add('open'); }
  function closePop(){ pop.hidden=true; wrap.classList.remove('open'); }
  trigger.addEventListener('click',(e)=>{ e.stopPropagation(); pop.hidden?openPop():closePop(); });
  pop.addEventListener('click',(e)=>{ const o=e.target.closest('.gs-opt'); if(!o) return;
    select.value=o.dataset.value; select.dispatchEvent(new Event('change',{bubbles:true})); sync(); closePop(); });
  select.addEventListener('change', sync);
  document.addEventListener('click',(e)=>{ if(!pop.hidden && !pop.contains(e.target) && e.target!==trigger) closePop(); });
  window.addEventListener('resize', ()=>{ if(!pop.hidden) closePop(); });
  document.addEventListener('scroll', ()=>{ if(!pop.hidden) closePop(); }, true);
  document.body.appendChild(pop);
}

/* 设置面板交互 */
(function wireSettings(){
  const modal=document.getElementById('settingsModal');
  document.getElementById('btnSettings').addEventListener('click',()=> modal.classList.add('show'));
  document.getElementById('btnSettingsClose').addEventListener('click',()=> modal.classList.remove('show'));
  modal.addEventListener('click',(e)=>{ if(e.target===modal) modal.classList.remove('show'); });
  document.querySelectorAll('#themeSeg .seg-btn').forEach(b=> b.addEventListener('click',()=>{ settings.theme=b.dataset.theme; saveSettings(); applyTheme(); }));
  const customRow=document.getElementById('customRow');
  const bgSelect=setupGlassSelect('bgModeTrigger','bgModePop',(v)=>{
    settings.bgMode=v; customRow.hidden = v!=='custom'; saveSettings(); applyBackground();
  });
  customRow.hidden = settings.bgMode!=='custom';
  bgSelect.setVal(settings.bgMode, true);
  document.getElementById('bgUpload').addEventListener('change',(e)=>{ const f=e.target.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>{ settings.customBg=r.result; settings.bgMode='custom'; customRow.hidden=false; bgSelect.setVal('custom', true); saveSettings(); applyBackground(); }; r.readAsDataURL(f); });
  document.getElementById('btnClearBg').addEventListener('click',()=>{ settings.customBg=''; if(settings.bgMode==='custom'){ settings.bgMode='aurora'; customRow.hidden=true; bgSelect.setVal('aurora', true); } saveSettings(); applyBackground(); });
  const glass=document.getElementById('glassRange'); glass.value=settings.glass; glass.addEventListener('input',()=>{ settings.glass=+glass.value; saveSettings(); applyGlass(); });
  document.getElementById('btnConfirmSettings').addEventListener('click',()=> modal.classList.remove('show'));
  document.getElementById('btnResetSettings').addEventListener('click',()=>{
    settings = { theme:'dark', bgMode:'auto', customBg:'', glass:8 };
    saveSettings(); applyTheme(); applyBackground(); applyGlass();
    glass.value=settings.glass; bgSelect.setVal(settings.bgMode, true); customRow.hidden = settings.bgMode!=='custom';
    toast('已恢复默认设置');
  });
})();

function applyBingWallpaper(){
  if(typeof fetch !== 'function') return; /* 老环境无 fetch：保留极光背景 */
  const bg = document.getElementById('bg');
  const credit = document.getElementById('bgCredit');
  fetch('https://bing.biturl.top/?resolution=1920&format=json&index=0&mkt=zh-CN')
    .then(r=>{ if(!r.ok) throw new Error('http '+r.status); return r.json(); })
    .then(d=>{ const u = d && d.url; if(!u) throw new Error('no url');
      const img = new Image();
      img.onload = ()=>{ bg.style.setProperty('--photo', `url('${u}')`); bg.classList.add('has-photo');
        credit.textContent = d.copyright ? '© '+d.copyright : '今日 Bing 壁纸'; credit.classList.add('show'); };
      img.onerror = ()=>{ /* 图片加载失败：保持极光背景 */ };
      img.src = u;
    })
    .catch(()=>{ if(settings.bgMode==='auto') toast('未联网，已使用内置极光背景'); });
}
/* 苹果风动效：滚动揭示（全局 scroll + rAF 节流，进度写入 CSS 变量；尊重“减少动态”偏好） */
let _revealEls=[];
function revealCollect(){ return [...document.querySelectorAll('.card, .item')]; }
function updateReveal(){
  const ed=document.querySelector('.editor'); if(!ed) return;
  const vh=window.innerHeight, start=vh*0.96, end=vh*0.6;
  for(const el of _revealEls){ const r=el.getBoundingClientRect();
    let p=(start-r.top)/(start-end); p=p<0?0:(p>1?1:p); p=p*p*(3-2*p); el.style.setProperty('--reveal', p.toFixed(3)); }
}
function initReveal(){
  const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduce) return;
  _revealEls = revealCollect(); document.body.classList.add('js-reveal');
  let ticking=false;
  const onScroll=()=>{ if(!ticking){ ticking=true; requestAnimationFrame(()=>{ ticking=false; updateReveal(); }); } };
  const ed=document.querySelector('.editor'); if(ed) ed.addEventListener('scroll', onScroll, {passive:true});
  window.addEventListener('resize', onScroll);
  updateReveal();
}
applyTheme(); applyBackground(); applyGlass();
refresh();
initReveal();
